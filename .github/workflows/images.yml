name: images

on:
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Rebuild the full catalog and promote stable tags after validation
        required: true
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: release scope
    runs-on: ubuntu-22.04
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}
      variant_matrix: ${{ steps.scope.outputs.variant_matrix }}
      package_matrix: ${{ steps.scope.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect release-affecting changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/release-matrix.py --all >>"$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha=$BEFORE_SHA
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha=$PR_BASE_SHA
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            python3 scripts/release-matrix.py --all >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Both PR validation and main publication use the changed families,
          # not every entry in the shared metadata file. Unchanged immutable
          # tags must never become new release candidates.
          python3 scripts/release-matrix.py --publish-changes-from "$base_sha" >>"$GITHUB_OUTPUT"

  package-access:
    name: package access (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.release_required == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.package_matrix) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify package write and public pull access
        env:
          PROBE_REF: ${{ matrix.repository }}:access-${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'FROM scratch\nLABEL ai.labpod.image.access-probe=true\n' | \
            docker buildx build --file - --tag "$PROBE_REF" --push .
          docker logout ghcr.io
          docker pull "$PROBE_REF"

  validate_pr:
    name: validate PR (${{ matrix.name }}:${{ matrix.tag }})
    needs: changes
    if: needs.changes.outputs.release_required == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.variant_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check release tag availability
        env:
          STABLE_REF: ${{ matrix.repository }}:${{ matrix.tag }}
        run: |
          if docker buildx imagetools inspect "$STABLE_REF" >/dev/null 2>&1; then
            echo "::error::$STABLE_REF release tag already exists; advance the vN prefix" >&2
            exit 1
          fi

      - name: Compute build-input digest
        id: build_input
        env:
          BUILD_INPUT_ARGS: ${{ matrix.build_input_args }}
        run: >-
          python3 scripts/build-input-digest.py
          --context "${{ matrix.context }}"
          --dockerfile "${{ matrix.dockerfile }}"
          --build-args "$BUILD_INPUT_ARGS"

      - name: Build candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ai.labpod.image.build-input-digest=${{ steps.build_input.outputs.digest }}
          tags: ${{ matrix.repository }}:candidate-${{ github.sha }}-${{ matrix.tag }}
          build-args: ${{ matrix.build_args }}

  validate_release:
    name: validate release (${{ matrix.name }}:${{ matrix.tag }})
    needs: [changes, package-access]
    if: >-
      always() && needs.changes.outputs.release_required == 'true' &&
      github.event_name != 'pull_request' && needs.package-access.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.variant_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Select candidate reference
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ matrix.repository }}
          RELEASE_TAG: ${{ matrix.tag }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PROMOTE_STABLE: ${{ inputs.promote_stable }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || ( "$EVENT_NAME" == workflow_dispatch && "$PROMOTE_STABLE" != true ) ]]; then
            REBUILD_DATE=$(date -u +%Y%m%d)
            REBUILD_REF="${REPOSITORY}:rebuild-${REBUILD_DATE}-${RUN_ID}-${RUN_ATTEMPT}-${RELEASE_TAG}"
            echo "candidate_ref=$REBUILD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_ref=${REPOSITORY}:candidate-${SOURCE_SHA}-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build-input digest
        id: build_input
        env:
          BUILD_INPUT_ARGS: ${{ matrix.build_input_args }}
        run: >-
          python3 scripts/build-input-digest.py
          --context "${{ matrix.context }}"
          --dockerfile "${{ matrix.dockerfile }}"
          --build-args "$BUILD_INPUT_ARGS"

      - name: Build candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ai.labpod.image.build-input-digest=${{ steps.build_input.outputs.digest }}
          tags: ${{ steps.refs.outputs.candidate_ref }}
          build-args: ${{ matrix.build_args }}

      - name: Smoke candidate through anonymous pull
        env:
          CANDIDATE_REF: ${{ steps.refs.outputs.candidate_ref }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_BUILD_INPUT_DIGEST: ${{ steps.build_input.outputs.digest }}
          IMAGE_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker builder prune --all --force
          docker pull "$CANDIDATE_REF"
          actual_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE_REF")
          [[ "$actual_ref" == *@"$EXPECTED_DIGEST" ]]
          scripts/smoke-image.sh "$CANDIDATE_REF" "$IMAGE_KIND"

  promote:
    name: promote (${{ matrix.name }}:${{ matrix.tag }})
    needs: [changes, validate_release]
    if: >-
      github.ref == 'refs/heads/main' && needs.validate_release.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.promote_stable))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.variant_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Promote validated candidate
        env:
          CANDIDATE_REF: ${{ matrix.repository }}:candidate-${{ github.sha }}-${{ matrix.tag }}
          STABLE_REF: ${{ matrix.repository }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          candidate_digest=$(docker buildx imagetools inspect --raw "$CANDIDATE_REF" | sha256sum | awk '{ print "sha256:" $1 }')

          # A failed matrix run can leave some tags promoted. Retrying the same
          # validated bytes is safe; a different manifest remains immutable.
          if docker buildx imagetools inspect "$STABLE_REF" >/dev/null 2>&1; then
            stable_digest=$(docker buildx imagetools inspect --raw "$STABLE_REF" | sha256sum | awk '{ print "sha256:" $1 }')
            if [[ "$stable_digest" == "$candidate_digest" ]]; then
              echo "$STABLE_REF already points at the validated candidate; promotion is complete"
            else
              echo "::error::$STABLE_REF points at different bytes; bump the release tag" >&2
              exit 1
            fi
          else
            docker buildx imagetools create --tag "$STABLE_REF" "$CANDIDATE_REF"
            stable_digest=$(docker buildx imagetools inspect --raw "$STABLE_REF" | sha256sum | awk '{ print "sha256:" $1 }')
          fi
          [[ -n "$candidate_digest" && "$stable_digest" == "$candidate_digest" ]]

      - name: Verify stable tag through anonymous pull
        env:
          STABLE_REF: ${{ matrix.repository }}:${{ matrix.tag }}
          IMAGE_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker pull "$STABLE_REF"
          scripts/smoke-image.sh "$STABLE_REF" "$IMAGE_KIND"

  gate:
    name: release gate
    if: always()
    needs: [changes, package-access, validate_pr, validate_release, promote]
    runs-on: ubuntu-22.04
    env:
      RELEASE_REQUIRED: ${{ needs.changes.outputs.release_required }}
      PACKAGE_ACCESS_RESULT: ${{ needs.package-access.result }}
      VALIDATE_PR_RESULT: ${{ needs.validate_pr.result }}
      VALIDATE_RELEASE_RESULT: ${{ needs.validate_release.result }}
      PROMOTE_RESULT: ${{ needs.promote.result }}
      IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      SHOULD_BUILD_REMOTE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      SHOULD_PROMOTE: >-
        ${{ github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.promote_stable)) }}
    steps:
      - name: Require the complete release result
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REQUIRED" != true ]]; then
            [[ "$VALIDATE_PR_RESULT" == skipped ]]
            [[ "$VALIDATE_RELEASE_RESULT" == skipped ]]
            [[ "$PROMOTE_RESULT" == skipped ]]
            exit 0
          fi
          if [[ "$IS_PULL_REQUEST" == true ]]; then
            [[ "$PACKAGE_ACCESS_RESULT" == skipped ]]
            [[ "$VALIDATE_PR_RESULT" == success ]]
            [[ "$VALIDATE_RELEASE_RESULT" == skipped ]]
          elif [[ "$SHOULD_BUILD_REMOTE" == true ]]; then
            [[ "$PACKAGE_ACCESS_RESULT" == success ]]
            [[ "$VALIDATE_PR_RESULT" == skipped ]]
            [[ "$VALIDATE_RELEASE_RESULT" == success ]]
          else
            [[ "$PACKAGE_ACCESS_RESULT" == skipped ]]
            [[ "$VALIDATE_PR_RESULT" == skipped ]]
            [[ "$VALIDATE_RELEASE_RESULT" == skipped ]]
          fi
          if [[ "$SHOULD_PROMOTE" == true ]]; then
            [[ "$PROMOTE_RESULT" == success ]]
          else
            [[ "$PROMOTE_RESULT" == skipped ]]
          fi
