name: images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: release scope
    runs-on: ubuntu-22.04
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect release-affecting changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'release_required=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha=$BEFORE_SHA
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha=$PR_BASE_SHA
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo 'release_required=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base_sha" "$GITHUB_SHA" > /tmp/changed-files
          if grep -Eq '^(images/|scripts/|\.github/dependabot\.yml$|\.github/workflows/(images|ci|bump-image-pins)\.yml$)' /tmp/changed-files; then
            echo 'release_required=true' >>"$GITHUB_OUTPUT"
          else
            echo 'release_required=false' >>"$GITHUB_OUTPUT"
          fi

  package-access:
    name: package access (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.release_required == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: code-server, repository: ghcr.io/labpod/code-server, current_tag: latest}
          - {name: pytorch-jupyter, repository: ghcr.io/labpod/pytorch-jupyter, current_tag: cu126}
          - {name: tensorflow-jupyter, repository: ghcr.io/labpod/tensorflow-jupyter, current_tag: cu125}
          - {name: scipy-jupyter, repository: ghcr.io/labpod/scipy-jupyter, current_tag: py312}
          - {name: pytorch-demo, repository: ghcr.io/labpod/pytorch-demo, current_tag: cpu}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify package write access
        env:
          SOURCE_REF: ${{ matrix.repository }}:${{ matrix.current_tag }}
          PROBE_REF: ${{ matrix.repository }}:access-${{ github.sha }}
        run: docker buildx imagetools create --tag "$PROBE_REF" "$SOURCE_REF"

  validate:
    name: validate (${{ matrix.name }}:${{ matrix.tag }})
    needs: [changes, package-access]
    if: >-
      always() && needs.changes.outputs.release_required == 'true' &&
      (github.event_name == 'pull_request' || needs.package-access.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: code-server
            repository: ghcr.io/labpod/code-server
            tag: latest
            context: images/code-server
            dockerfile: images/code-server/Dockerfile
            kind: code-server
            build_args: ''
          - name: pytorch-jupyter
            repository: ghcr.io/labpod/pytorch-jupyter
            tag: cu121
            context: images/pytorch-jupyter
            dockerfile: images/pytorch-jupyter/Dockerfile
            kind: pytorch-jupyter
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.1.1-runtime-ubuntu22.04
              TORCH_CUDA=cu121
              TORCH_VERSION=2.5.1
              TORCHVISION_VERSION=0.20.1
          - name: pytorch-jupyter
            repository: ghcr.io/labpod/pytorch-jupyter
            tag: cu126
            context: images/pytorch-jupyter
            dockerfile: images/pytorch-jupyter/Dockerfile
            kind: pytorch-jupyter
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.6.3-runtime-ubuntu24.04
              TORCH_CUDA=cu126
              TORCH_VERSION=2.8.0
              TORCHVISION_VERSION=0.23.0
          - name: pytorch-jupyter
            repository: ghcr.io/labpod/pytorch-jupyter
            tag: cu129
            context: images/pytorch-jupyter
            dockerfile: images/pytorch-jupyter/Dockerfile
            kind: pytorch-jupyter
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.9.1-runtime-ubuntu24.04
              TORCH_CUDA=cu129
              TORCH_VERSION=2.8.0
              TORCHVISION_VERSION=0.23.0
          - name: tensorflow-jupyter
            repository: ghcr.io/labpod/tensorflow-jupyter
            tag: cu125
            context: images/tensorflow-jupyter
            dockerfile: images/tensorflow-jupyter/Dockerfile
            kind: tensorflow-jupyter
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.5.1-runtime-ubuntu24.04
              TF_VERSION=2.21.0
              CUDNN_VERSION=9.10.2.21
          - name: scipy-jupyter
            repository: ghcr.io/labpod/scipy-jupyter
            tag: py312
            context: images/scipy-jupyter
            dockerfile: images/scipy-jupyter/Dockerfile
            kind: scipy-jupyter
            build_args: BASE_IMAGE=docker.io/ubuntu:24.04
          - name: pytorch-demo
            repository: ghcr.io/labpod/pytorch-demo
            tag: cpu
            context: images/pytorch-demo
            dockerfile: images/pytorch-demo/Dockerfile
            kind: pytorch-demo
            build_args: |
              CUDA_BASE_IMAGE=docker.io/ubuntu:24.04
              TORCH_CUDA=cpu
              TORCH_VERSION=2.8.0
              TORCHVISION_VERSION=0.23.0
          - name: pytorch-demo
            repository: ghcr.io/labpod/pytorch-demo
            tag: cu121
            context: images/pytorch-demo
            dockerfile: images/pytorch-demo/Dockerfile
            kind: pytorch-demo
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.1.1-runtime-ubuntu22.04
              TORCH_CUDA=cu121
              TORCH_VERSION=2.5.1
              TORCHVISION_VERSION=0.20.1
          - name: pytorch-demo
            repository: ghcr.io/labpod/pytorch-demo
            tag: cu126
            context: images/pytorch-demo
            dockerfile: images/pytorch-demo/Dockerfile
            kind: pytorch-demo
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.6.3-runtime-ubuntu24.04
              TORCH_CUDA=cu126
              TORCH_VERSION=2.8.0
              TORCHVISION_VERSION=0.23.0
          - name: pytorch-demo
            repository: ghcr.io/labpod/pytorch-demo
            tag: cu129
            context: images/pytorch-demo
            dockerfile: images/pytorch-demo/Dockerfile
            kind: pytorch-demo
            build_args: |
              CUDA_BASE_IMAGE=docker.io/nvidia/cuda:12.9.1-runtime-ubuntu24.04
              TORCH_CUDA=cu129
              TORCH_VERSION=2.8.0
              TORCHVISION_VERSION=0.23.0
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.repository }}:candidate-${{ github.sha }}-${{ matrix.tag }}
          build-args: ${{ matrix.build_args }}

      - name: Smoke candidate through anonymous pull
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CANDIDATE_REF: ${{ matrix.repository }}:candidate-${{ github.sha }}-${{ matrix.tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker builder prune --all --force
          docker pull "$CANDIDATE_REF"
          actual_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE_REF")
          [[ "$actual_ref" == *@"$EXPECTED_DIGEST" ]]
          scripts/smoke-image.sh "$CANDIDATE_REF" "$IMAGE_KIND"

  promote:
    name: promote (${{ matrix.name }}:${{ matrix.tag }})
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: code-server, repository: ghcr.io/labpod/code-server, tag: latest, kind: code-server}
          - {name: pytorch-jupyter, repository: ghcr.io/labpod/pytorch-jupyter, tag: cu121, kind: pytorch-jupyter}
          - {name: pytorch-jupyter, repository: ghcr.io/labpod/pytorch-jupyter, tag: cu126, kind: pytorch-jupyter}
          - {name: pytorch-jupyter, repository: ghcr.io/labpod/pytorch-jupyter, tag: cu129, kind: pytorch-jupyter}
          - {name: tensorflow-jupyter, repository: ghcr.io/labpod/tensorflow-jupyter, tag: cu125, kind: tensorflow-jupyter}
          - {name: scipy-jupyter, repository: ghcr.io/labpod/scipy-jupyter, tag: py312, kind: scipy-jupyter}
          - {name: pytorch-demo, repository: ghcr.io/labpod/pytorch-demo, tag: cpu, kind: pytorch-demo}
          - {name: pytorch-demo, repository: ghcr.io/labpod/pytorch-demo, tag: cu121, kind: pytorch-demo}
          - {name: pytorch-demo, repository: ghcr.io/labpod/pytorch-demo, tag: cu126, kind: pytorch-demo}
          - {name: pytorch-demo, repository: ghcr.io/labpod/pytorch-demo, tag: cu129, kind: pytorch-demo}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote validated candidate
        env:
          CANDIDATE_REF: ${{ matrix.repository }}:candidate-${{ github.sha }}-${{ matrix.tag }}
          STABLE_REF: ${{ matrix.repository }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$STABLE_REF" "$CANDIDATE_REF"
          candidate_digest=$(docker buildx imagetools inspect --raw "$CANDIDATE_REF" | sha256sum | awk '{ print "sha256:" $1 }')
          stable_digest=$(docker buildx imagetools inspect --raw "$STABLE_REF" | sha256sum | awk '{ print "sha256:" $1 }')
          [[ -n "$candidate_digest" && "$stable_digest" == "$candidate_digest" ]]

      - name: Verify stable tag through anonymous pull
        env:
          STABLE_REF: ${{ matrix.repository }}:${{ matrix.tag }}
          IMAGE_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker pull "$STABLE_REF"
          scripts/smoke-image.sh "$STABLE_REF" "$IMAGE_KIND"

  gate:
    name: release gate
    if: always()
    needs: [changes, package-access, validate, promote]
    runs-on: ubuntu-22.04
    env:
      RELEASE_REQUIRED: ${{ needs.changes.outputs.release_required }}
      PACKAGE_ACCESS_RESULT: ${{ needs.package-access.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      PROMOTE_RESULT: ${{ needs.promote.result }}
      SHOULD_PROMOTE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Require the complete release result
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REQUIRED" != true ]]; then
            [[ "$VALIDATE_RESULT" == skipped && "$PROMOTE_RESULT" == skipped ]]
            exit 0
          fi
          [[ "$VALIDATE_RESULT" == success ]]
          if [[ "$SHOULD_PROMOTE" == true ]]; then
            [[ "$PACKAGE_ACCESS_RESULT" == success ]]
            [[ "$PROMOTE_RESULT" == success ]]
          else
            [[ "$PACKAGE_ACCESS_RESULT" == skipped ]]
            [[ "$PROMOTE_RESULT" == skipped ]]
          fi
