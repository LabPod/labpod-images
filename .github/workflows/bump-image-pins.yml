name: bump-image-pins

# Bumps the version pins embedded in the image release catalog (torch/
# torchvision, TensorFlow, code-server) that Dependabot can't see, and opens a
# review PR. The PR image matrix runs validate-only (no publish), so a bad
# wheel/version combination is caught before merge.
#
# One-time owner setup — a scoped Personal Access Token:
#   This job pushes its branch with a fine-grained PAT so the resulting PR can
#   trigger image validation workflows; GitHub suppresses workflow runs for PRs
#   created by the repository GITHUB_TOKEN. Grant contents:write and
#   pull-requests:write on LabPod/labpod-images and store the token as
#   BUMP_PIN_TOKEN. Without it the job no-ops with a warning (base-image and
#   action bumps still flow through Dependabot).

on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'

concurrency:
  group: bump-image-pins
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_TOKEN: ${{ secrets.BUMP_PIN_TOKEN != '' }}
    steps:
      - name: Check for bump token
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::BUMP_PIN_TOKEN is not set — skipping. Create a fine-grained PAT with contents+pull-requests write on LabPod/labpod-images and add it as the BUMP_PIN_TOKEN secret to enable auto-bump PRs. Dependabot still handles base images and actions."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.BUMP_PIN_TOKEN }}

      - name: Bump pins
        id: bump
        if: env.HAS_TOKEN == 'true'
        run: python3 scripts/bump-image-pins.py

      - name: Open pull request
        if: env.HAS_TOKEN == 'true' && steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BUMP_PIN_TOKEN }}
          branch: bump/image-pins
          delete-branch: true
          title: 'images: bump build-matrix version pins'
          commit-message: 'images: bump build-matrix version pins'
          body: |
            Automated bump of the version pins embedded in the image release
            catalog (torch/torchvision, TensorFlow, code-server).

            ${{ steps.bump.outputs.summary }}

            **Review before merge.** The affected image variants on this PR run
            validate-only (no publish) — confirm they pass, and sanity-check the
            torch/torchvision pairing, before merging. Merging to `main`
            publishes candidates and promotes the affected stable tags only
            after every selected candidate passes.

            Opened by the `bump-image-pins` workflow.
          labels: automated, images
